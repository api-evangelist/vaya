aid: vaya
name: Vaya
description: >-
  Vaya is an AI-powered Vedic astrology platform from Anuvaya Labs Technologies Pvt Ltd (New
  Delhi, India) that connects users with classically trained Parashari astrologers for live
  chat consultations, alongside free tools for Kundli (birth chart), horoscope, dasha, kundli
  matching, marriage prediction, navamsa, and panchang. Founded by Maahin Puri and Nitesh
  Kumar Niranjan (previously co-founders of Atlys), Vaya is backed by Accel, Arkam Ventures,
  and Weekend Fund, and ships as iOS and Android apps with no public API or developer program.
